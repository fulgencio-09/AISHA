name: Corregir persistencia del crédito en Abonos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corregir limpieza del crédito
        shell: python
        run: |
          from pathlib import Path

          path = Path('resources/js/vue/components/Abonos/index.vue')
          text = path.read_text(encoding='utf-8')

          old = """                        this.asignatura_id = '';\n                        this.creditoSeleccionado = '';\n                        this.fechas = '';\n                        this.cantidad = '';\n                        this.movimiento = '';\n                        this.deuda = '';\n                        this.formapago = '';\n                        this.estado = '';"""

          new = """                        this.asignatura_id = '';\n                        // Se conserva el crédito mostrado después de guardar el pago.\n                        this.fechas = '';\n                        this.cantidad = '';\n                        this.movimiento = '';\n                        this.deuda = '';\n                        this.formapago = '';\n                        this.estado = '';"""

          if old not in text:
              raise SystemExit('No se encontró el bloque de limpieza posterior al guardado.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validar
        shell: bash
        run: |
          git diff --check
          grep -q "Se conserva el crédito mostrado después de guardar el pago" resources/js/vue/components/Abonos/index.vue
          git diff -- resources/js/vue/components/Abonos/index.vue

      - name: Confirmar y retirar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-abono-credit-persist.yml
          git add resources/js/vue/components/Abonos/index.vue .github/workflows/fix-abono-credit-persist.yml
          git commit -m "Mantener crédito visible después de guardar abono"
          git push origin main

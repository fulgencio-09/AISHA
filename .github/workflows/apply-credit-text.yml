name: Aplicar crédito como texto

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'AISHA Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('resources/js/vue/components/Abonos/index.vue')
          s=p.read_text()
          old='''                                    <div class="col-12 col-sm-3 input-group-sm">\n                                        <label class="form-label">Crédito</label>\n                                        <select v-model="asignatura_id" class="form-select" id="estad"\n                                            aria-label="Crédito" :disabled="!!asignatura_id">\n                                            <option value="">Seleccione</option>\n                                            <option v-for="itemb in cred" :key="itemb.id" :value="itemb.id">\n                                                {{ formatoCOP(itemb.valor) }}\n                                            </option>\n                                        </select>\n                                    </div>'''
          new='''                                    <div class="col-12 col-sm-3 input-group-sm">\n                                        <label class="form-label">Crédito</label>\n                                        <input type="text" class="form-control" :value="creditoFormateado" readonly>\n                                    </div>'''
          if old in s:
              s=s.replace(old,new,1)
              s=s.replace("            credito: '',\n            deuda: '',", "            credito: '',\n            creditoSeleccionado: '',\n            deuda: '',", 1)
              s=s.replace("        nombreSemestre() {", "        creditoFormateado() {\n            return this.creditoSeleccionado !== '' ? this.formatoCOP(this.creditoSeleccionado) : '';\n        },\n        nombreSemestre() {", 1)
              s=s.replace("                        this.deuda = this.cred[0].valor;\n                        this.año =", "                        this.deuda = this.cred[0].valor;\n                        this.creditoSeleccionado = this.cred[0].valor;\n                        this.año =", 1)
              s=s.replace('                    estad.disabled = true\n','',1)
              s=s.replace('            estad.disabled = false\n','',2)
              s=s.replace("                        this.asignatura_id = '';\n                        this.fechas = '';", "                        this.asignatura_id = '';\n                        this.creditoSeleccionado = '';\n                        this.fechas = '';",1)
              s=s.replace("                    this.asignatura_id = '';\n\n                    this.isLoading", "                    this.asignatura_id = '';\n                    this.creditoSeleccionado = '';\n\n                    this.isLoading",1)
              p.write_text(s)
          PY
          git config user.name 'AISHA Bot'
          git config user.email 'aisha-bot@users.noreply.github.com'
          git add resources/js/vue/components/Abonos/index.vue
          git diff --cached --quiet || git commit -m 'Cambiar crédito a campo de texto en Abonos'
          git push

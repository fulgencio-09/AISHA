name: Corregir saldo del crédito v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar saldo mostrado
        shell: python
        run: |
          from pathlib import Path
          path = Path('resources/js/vue/components/Abonos/index.vue')
          text = path.read_text(encoding='utf-8')

          marker = '                        this.pagos = res.data;\n'
          insertion = '''                        this.pagos = res.data;\n                        // Mostrar en Crédito el saldo restante devuelto por el backend.\n                        const saldoRestante = Number(res.data?.input?.deuda ?? this.deuda) || 0;\n                        this.creditoSeleccionado = saldoRestante;\n                        this.deuda = saldoRestante;\n'''

          if insertion in text:
              raise SystemExit('El cambio ya estaba aplicado')
          if marker not in text:
              raise SystemExit('No se encontró el punto de actualización del crédito')

          text = text.replace(marker, insertion, 1)
          path.write_text(text, encoding='utf-8', newline='')

      - name: Validar
        shell: bash
        run: |
          git diff --check
          grep -q 'const saldoRestante' resources/js/vue/components/Abonos/index.vue
          grep -q 'this.creditoSeleccionado = saldoRestante' resources/js/vue/components/Abonos/index.vue

      - name: Confirmar y limpiar workflows temporales
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-abono-credit-balance.yml
          rm -f .github/workflows/fix-abono-credit-balance-v2.yml
          git add resources/js/vue/components/Abonos/index.vue .github/workflows/fix-abono-credit-balance.yml .github/workflows/fix-abono-credit-balance-v2.yml
          git commit -m "Actualizar crédito con saldo restante al guardar abono"
          git push origin main

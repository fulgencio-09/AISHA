name: Bloquear crédito en Abonos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear crédito después de seleccionarlo
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('resources/js/vue/components/Abonos/index.vue')
          text = path.read_text(encoding='utf-8')

          pattern = r'(<select\s+v-model="asignatura_id"\s+class="form-select"\s+id="estad"\s+aria-label="Crédito")>'
          replacement = r'\1 :disabled="!!asignatura_id">'

          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('No se encontró exactamente el selector de crédito esperado')

          path.write_text(updated, encoding='utf-8', newline='')

      - name: Verificar y confirmar
        shell: bash
        run: |
          git diff --check
          grep -q ':disabled="!!asignatura_id"' resources/js/vue/components/Abonos/index.vue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/lock-credit-abonos.yml
          git add resources/js/vue/components/Abonos/index.vue .github/workflows/lock-credit-abonos.yml
          git commit -m "Bloquear crédito seleccionado en Abonos"
          git push origin main
